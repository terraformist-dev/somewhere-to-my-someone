name: Build app

# Runs every time code is pushed to main, or when you tap "Run workflow" on GitHub.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build the app
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace 2>&1 | tee build.log
          exit "${PIPESTATUS[0]}"

      # If the build breaks, list the errors on the run's page so they're easy to find.
      - name: Show build errors
        if: failure()
        run: |
          grep -E '^e: |error:|FAILURE|What went wrong' -A 3 build.log | head -60 | while IFS= read -r line; do
            echo "::error::${line//%/%25}"
          done

      - name: Name the file
        run: cp app/build/outputs/apk/debug/app-debug.apk somewhere-to-my-someone.apk

      - name: Keep a copy with this run
        uses: actions/upload-artifact@v4
        with:
          name: somewhere-to-my-someone-apk
          path: somewhere-to-my-someone.apk

      - name: Publish as the latest download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" somewhere-to-my-someone.apk \
            --target "${{ github.sha }}" \
            --title "Somewhere to my Someone · build ${{ github.run_number }}" \
            --notes "Tap **somewhere-to-my-someone.apk** below to download, then open it to install." \
            --latest
